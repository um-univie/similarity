[package]
name = "similarity"
version = "0.4.0"
edition = "2021"
# The optional `avx512` feature needs Rust >= 1.89.
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/um-univie/similarity"
description = "Similarity, distance and divergence metrics for vectors, sets and mass spectra, with SIMD and fast spectral library search"
readme = "README.md"
keywords = ["similarity", "distance", "correlation", "entropy", "statistics"]
categories = ["science", "algorithms", "mathematics"]
authors = ["Manuel Uhlir <manuel.uhlir@univie.ac.at>"]
exclude = ["python/", ".github/"]

[lib]
name = "similarity"
#crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = { version = "1.10", optional = true }
rand = "0.9.1"
num-traits = "0.2.19"
rustfft = { version = "6.4.0", optional = true }
pulp = "0.22"
bytemuck = "1"

[dev-dependencies]
criterion = "0.6.0"
approx = "0.5"
proptest = "1.9.0"

[features]
default = ["parallel", "fft"]
parallel = ["rayon"]
fft = ["rustfft"]
# Enables AVX-512 kernels on x86-64 CPUs that support them (runtime-detected).
avx512 = ["pulp/x86-v4"]

[package.metadata.docs.rs]
all-features = true

[[example]]
name = "trait_demo"
required-features = ["parallel"]

[[bench]]
name = "benchmarks"
harness = false

[[bench]]
name = "spectral_entropy_benchmarks"
harness = false

[[bench]]
name = "similarity_benchmarks"
harness = false

[[bench]]
name = "entropy_benchmarks"
harness = false

[[bench]]
name = "transform_benchmarks"
harness = false

[[bench]]
name = "zero_cost_abstraction_benchmarks"
harness = false

[[bench]]
name = "simd_benchmarks"
harness = false

[[bench]]
name = "extended_benchmarks"
harness = false



[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.bench]
opt-level = 3
lto = true
codegen-units = 1

